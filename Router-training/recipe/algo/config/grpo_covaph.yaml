# CoVaPh Tool Selection GRPO Training Configuration
# Optimized for A100 80GB GPUs

hydra:
  searchpath:
    # Use relative path since Ray job packs working_dir to temporary location
    # The working_dir is set to BASE_DIR in train_covaph.sh, so verl/ is relative to it
    # This works because Ray copies the entire working_dir structure to the temp location
    - file://verl/trainer/config

defaults:
  - grpo_trainer
  - _self_

# Ray initialization
ray_init:
  num_cpus: 32

# Data configuration
data:
  train_files: ['covaph_train_data.jsonl']
  val_files: ['covaph_val_data.jsonl']
  train_tool_config_path: covaph_tools.json
  test_tool_config_path: covaph_tools.json
  shuffle_train_dataloader: true
  train_batch_size: 8
  gen_batch_size: 32
  val_batch_size: 16
  max_prompt_length: 8192
  max_response_length: 2048
  truncation: 'left'
  prompt_template: qwen-base

# Algorithm configuration
algorithm:
  adv_estimator: grpo
  filter_groups:
    enable: true
    metric: seq_reward
  kl_ctrl:
    kl_coef: 0.0001
  use_kl_in_reward: false

# Actor/Rollout/Reference configuration
actor_rollout_ref:
  model:
    path: Qwen/Qwen3-8B
    use_remove_padding: true
    enable_gradient_checkpointing: true
  actor:
    strategy: fsdp
    optim:
      lr: 1e-6
    ppo_mini_batch_size: 8
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 10.0
    ppo_epochs: 1
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 8192
    entropy_coeff: 0
    use_kl_loss: true
    kl_loss_coef: 0.0001
    kl_loss_type: mse
    correct_sample_advantage_boost_value: 0.1
    # Minimum reward standard deviation threshold for sample filtering
    # Only samples with reward std > this threshold will be selected for training
    # Lower values allow more samples, higher values require more variance
    min_reward_std_threshold: 0.1
    fsdp_config:
      param_offload: false
      optimizer_offload: true
  rollout:
    name: vllm
    n_agent: 4
    tensor_model_parallel_size: 1
    temperature: 1.0
    gpu_memory_utilization: 0.75
    n: 1
    enforce_eager: false
    free_cache_engine: false
    enable_chunked_prefill: false
    log_prob_max_token_len_per_gpu: 8192
    val_kwargs:
      temperature: 0.6
      n: 4
      do_sample: true
  ref:
    fsdp_config:
      param_offload: true
    log_prob_max_token_len_per_gpu: 8192

# Critic configuration
critic:
  strategy: fsdp

# Reward model (disabled, using CoVaPh reward manager)
reward_model:
  enable: false

# Reward manager
reward_manager:
  type: covaph
  max_concurrency: 64
  use_remote_reward: false

# Stop penalty
stop_properly_penalty:
  penalty_coef: 0.1

# Trainer configuration
trainer:
  device: cuda
  n_gpus_per_node: 1
  nnodes: 1
  critic_warmup: 0
  logger: ['console', 'wandb']
  project_name: covaph_orchestrator
  experiment_name: tool_selection
  val_before_train: false
  log_val_generations: 8
  save_freq: 1
  test_freq: 1000000
  total_epochs: 5
  default_local_dir: checkpoints/base

# Max turns for multi-turn dialogue
max_turns: 10

