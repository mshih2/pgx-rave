defaults:
  - ppo_trainer
  - _self_

data:
  gen_batch_size: ${data.train_batch_size}
  # Use BASE_DIR environment variable to construct absolute paths
  # If BASE_DIR is not set, falls back to relative path
  train_tool_config_path: ${oc.env:BASE_DIR,./verl}/trainer/tool_configs/0615_1601.json
  test_tool_config_path: ${oc.env:BASE_DIR,./verl}/trainer/tool_configs/0615_1601.json
  prompt_template: qwen-base

reward_model:
  reward_manager: dapo
  overlong_buffer: 
    enable: False # We try to avoid forgetting to set enable
    len: 0
    penalty_factor: 0.0
    log: False

algorithm:
  filter_groups:
    enable: False # We try to avoid forgetting to set enable
    metric: null # acc / score / seq_reward / seq_final_reward / ...
    max_num_gen_batches: 0 # Non-positive values mean no upper limit

trainer:
  project_name: verl-dapo
